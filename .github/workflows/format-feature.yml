name: Format opportunities feature

on:
  push:
    branches:
      - feature/ai-safety-opportunities
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/opportunities.astro src/components/Navigation.astro src/data/opportunities-curated.json src/data/opportunities-live.json scripts/update-opportunities.mjs README.md .github/workflows/refresh-opportunities.yml
          if ! git diff --cached --quiet; then
            git commit -m "Format opportunities feature"
            git push
          fi
